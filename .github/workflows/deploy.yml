name: Deploy to Contabo VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Deploy to Contabo VPS via SSH rsync
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TEST }}
          ARGS: "-rlgoDzvO --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: ${{ secrets.SERVER_TARGET }}
          EXCLUDE: "/node_modules/"

      - name: Fix permissions and verify files on VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TEST }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            TARGET_DIR=\"${{ secrets.SERVER_TARGET }}\"
            PARENT_DIR=\$(dirname \"\$TARGET_DIR\")
            echo \"=== Permissions of parent directory ===\"
            ls -ld \"\$PARENT_DIR\"
            echo \"=== Permissions of target directory ===\"
            ls -ld \"\$TARGET_DIR\"
            echo \"=== Target directory contents ===\"
            ls -la \"\$TARGET_DIR\"
            echo \"=== Adjusting permissions to 755 ===\"
            chmod 755 \"\$PARENT_DIR\" || true
            chmod -R 755 \"\$TARGET_DIR\"
            echo \"=== Permissions adjusted successfully ===\"
          "

